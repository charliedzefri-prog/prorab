<style>:root{
  --bg:#233f77; --bg2:#1d3566; --tile:#233f77; --tile-hover:#2c4d8f; --border:#b8bdc8;
  --accent:#f4f03c; --text:#ffffff; --muted:#b9c4dc; --head:#212121; --input:#1a2f5c;
  --danger:#ff6b6b; --ok:#6ee07a; --card:#1e3870; --shadow:0 6px 24px rgba(0,0,0,.35);
}
body.dark{
  --bg:#161616; --bg2:#101010; --tile:#1f1f1f; --tile-hover:#2a2a2a; --border:#5a5a5a;
  --input:#262626; --card:#1d1d1d; --muted:#a8a8a8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
#app{min-height:100%;display:flex;flex-direction:column}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--head);display:flex;align-items:center;gap:6px;padding:0 10px;height:64px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.hdr .back{width:42px;height:42px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.hdr .back:hover,.hdr .ib:hover{background:rgba(255,255,255,.08)}
.hdr .title{flex:1;color:var(--accent);font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.hdr .title small{font-size:15px;color:#ddd;margin-left:6px}
.hdr .ib{width:52px;height:52px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;position:relative}
.hdr .ib svg{display:block}

main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:6px}

/* tiles */
.tiles{display:grid;gap:4px}
.tile{background:var(--tile);border:2px solid var(--border);border-radius:5px;min-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;color:var(--accent);font-style:italic;font-size:22px;text-align:center;padding:10px;position:relative;user-select:none;transition:background .15s}
.tile:hover{background:var(--tile-hover)}
.tile:active{transform:scale(.99)}
.tile.sm{min-height:96px;font-size:19px}
.tile .badge{position:absolute;top:6px;right:8px;font-style:normal;font-size:13px;color:#fff;background:rgba(0,0,0,.35);border-radius:10px;padding:1px 7px}
.tile img{max-width:90px;max-height:90px;margin-bottom:6px}
.tile .sub{font-size:13px;color:var(--muted);font-style:normal;margin-top:4px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}
@media(max-width:560px){.tile{font-size:19px;min-height:120px}.tile.sm{font-size:16px;min-height:84px}.g4{grid-template-columns:1fr 1fr}}

/* tabs */
.tabs{display:flex;background:var(--head);position:sticky;top:64px;z-index:15;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;border:none;background:none;color:#ccc;padding:13px 16px;cursor:pointer;text-transform:uppercase;font-size:14px;letter-spacing:.5px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* forms */
.card{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:14px;margin:8px 0}
.card h3{margin:0 0 10px;color:var(--accent);font-weight:500;font-size:17px;font-style:italic}
.row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row label,.fl{flex:1 1 180px;color:var(--muted);font-size:15px}
.fld{display:flex;align-items:center;gap:6px;flex:1 1 160px}
.fld .u{color:var(--muted);font-size:14px;min-width:28px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=search],input[type=password],select,textarea{width:100%;background:var(--input);border:1px solid rgba(255,255,255,.18);border-bottom:2px solid rgba(255,255,255,.35);border-radius:6px;padding:9px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--accent)}
select option{background:#1b2b4f;color:#fff}
textarea{min-height:120px;resize:vertical;line-height:1.4}
input.num{text-align:right}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.btn{background:transparent;border:1.5px solid var(--border);color:var(--accent);border-radius:6px;padding:9px 16px;cursor:pointer;font-style:italic;font-size:15px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--tile-hover)}
.btn.pri{background:var(--accent);color:#1b2b4f;border-color:var(--accent);font-style:normal;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hint{color:var(--muted);font-size:13px;line-height:1.45}
.err{color:var(--danger);font-weight:500}
.figure{text-align:center;margin:6px 0}
.figure img{max-width:100%;max-height:260px}

/* result */
.result{background:rgba(0,0,0,.22);border-left:3px solid var(--accent);border-radius:6px;padding:12px 14px;margin:10px 0}
.result table{width:100%;border-collapse:collapse}
.result td{padding:4px 2px;border-bottom:1px dashed rgba(255,255,255,.1);vertical-align:top}
.result td:first-child{color:var(--muted)}
.result td.v{text-align:right;font-weight:600;white-space:nowrap}
.result tr.sec td{color:var(--accent);font-style:italic;border-bottom:none;padding-top:10px}
.result tr.tot td{font-size:17px;color:var(--accent);border-top:1px solid rgba(255,255,255,.3)}
.result .note{color:var(--muted);font-size:13px;margin-top:8px;white-space:pre-line}

/* dynamic lists */
.dl{width:100%}
.dl .dr{display:grid;grid-template-columns:34px 1fr auto 30px;gap:6px;align-items:center;margin:5px 0}
.dl .dims{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.dl .dims input{width:76px;flex:1 1 60px}
.dl .dims .x{color:var(--muted)}
.dl .sign{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:none;cursor:pointer;font-weight:700;font-size:18px}
.dl .sign.p{color:var(--ok)}.dl .sign.m{color:var(--danger)}
.dl .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px}
.dl .sum{color:var(--muted);font-size:13px;min-width:70px;text-align:right}
.dl .desc{grid-column:2/4}
.dl .total{color:var(--accent);margin-top:6px;font-style:italic}

/* list items */
.list{display:flex;flex-direction:column;gap:4px}
.li{background:var(--tile);border:1.5px solid var(--border);border-radius:6px;padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
.li:hover{background:var(--tile-hover)}
.li .main{flex:1;min-width:0}
.li .t{color:var(--accent);font-style:italic;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.li .s{color:var(--muted);font-size:13px;margin-top:2px}
.li .r{text-align:right;white-space:nowrap;font-weight:600}
.li .more{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 6px;line-height:1}
.li.done .t{text-decoration:line-through;opacity:.75}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-style:italic}
.grp{color:var(--accent);font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.6px;padding:12px 4px 4px;display:flex;justify-content:space-between}
.grp span:last-child{color:var(--muted);font-weight:500}
.fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#1b2b4f;border:none;font-size:34px;cursor:pointer;box-shadow:var(--shadow);z-index:12;line-height:1}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.toolbar input[type=search]{flex:1 1 200px}

/* smeta items */
.sitem{display:grid;grid-template-columns:28px 1fr auto 30px;gap:8px;align-items:center;background:var(--tile);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:8px 8px;margin:3px 0}
.sitem .n{color:var(--muted);font-size:13px;text-align:center}
.sitem .nm{cursor:pointer}
.sitem .nm .t{color:#fff}
.sitem .nm .s{color:var(--muted);font-size:13px}
.sitem .sum{font-weight:600;white-space:nowrap;text-align:right}
.sitem.done{border-color:var(--ok)}
.sitem.done .nm .t{color:var(--ok)}
.sitem .cmt{color:#ffd27a;font-size:12px;font-style:italic}
.totals{background:rgba(0,0,0,.25);border-radius:8px;padding:10px 14px;margin:10px 0}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-size:18px;color:var(--accent);border-top:1px solid rgba(255,255,255,.25);margin-top:4px;padding-top:6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;animation:fade .12s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid rgba(255,255,255,.18);border-radius:10px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{max-width:820px}
.modal .mh{padding:14px 16px;color:var(--accent);font-size:19px;font-style:italic;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between}
.modal .mh button{background:none;border:none;color:#bbb;font-size:24px;cursor:pointer}
.modal .mb{padding:12px 16px;overflow:auto}
.modal .mf{padding:10px 16px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:none;padding:12px 8px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px}
.menu-list button:hover{background:var(--tile-hover)}
.menu-list button.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;z-index:200;box-shadow:var(--shadow);font-size:15px;max-width:90vw;text-align:center;animation:fade .15s}

/* calculator */
.calc{display:flex;flex-direction:column;gap:8px}
.calc .disp{background:#0d1a33;border-radius:8px;padding:10px 12px;text-align:right;min-height:84px;cursor:pointer}
body.dark .calc .disp{background:#0b0b0b}
.calc .expr{color:var(--muted);font-size:18px;word-break:break-all;min-height:24px}
.calc .res{color:#5ff0ff;font-size:32px;font-family:"Consolas","Courier New",monospace;word-break:break-all}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{padding:14px 0;font-size:21px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:#2d3e5e;cursor:pointer}
body.dark .calc .keys button{background:#2b2b2b}
.calc .keys button.op{background:#3d5480;color:var(--accent)}
.calc .keys button.eq{background:var(--accent);color:#1b2b4f;font-weight:700}
.calc .keys button:active{filter:brightness(1.3)}
.calc .hist{max-height:120px;overflow:auto;font-size:14px;color:var(--muted)}
.calc .hist div{padding:3px 4px;cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.08)}
.calc .hist div:hover{color:#fff}

/* laminate schema */
.schema{background:#fff;border-radius:6px;padding:6px;overflow:auto}
.schema svg{display:block;max-width:100%;height:auto}

.help{line-height:1.55}
.help h3{color:var(--accent);font-style:italic;font-weight:500;margin:18px 0 6px}
.help p{margin:6px 0;white-space:pre-line}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv div:nth-child(odd){color:var(--muted)}
.photo-grid{display:flex;gap:6px;flex-wrap:wrap}
.photo-grid img{width:96px;height:96px;object-fit:cover;border-radius:6px;cursor:pointer}
.warnbar{background:#7a5a00;color:#fff;padding:6px 12px;font-size:13px;text-align:center}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:rgba(255,255,255,.12);color:var(--muted);margin-left:6px}
.pill.ok{background:rgba(110,224,122,.18);color:var(--ok)}
.pill.warn{background:rgba(255,200,80,.18);color:#ffcf6b}
.center{text-align:center}
.mt{margin-top:12px}
.flex{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.pricebar{display:flex;gap:6px;align-items:center}
.pricebar select{width:auto;flex:0 0 auto}
.home{grid-template-columns:repeat(6,1fr)}
.home .tile{min-height:170px;font-size:23px}
@media(max-width:560px){.home .tile{min-height:150px;font-size:20px}}
.tile{position:relative}
</style>
</head>

const HELP={"about_help": "Информация", "about_text": "ПРОраб free ver.%s \n\n\tПриложение предназначено для помощи в расчётах при строительстве, отделке или ремонте. \n\tВ приложении можно контролировать свои финансы записывая доходы и расходы или вести отчёт по чекам. \n\tПриложение позволяет быстро составить сметы на отделочные работы и на материалы. \n\tДля разных заметок есть блокнот.", "angle_help": "Если вам нужно расчитать угол стены, то нужно воспользоваться угольником. Приставьте его в угол и замерте расстояние от угольника до стены - это будет катет А, а длина угольника будет катетом В. Чем больше будет угольник, тем точнее будет расчёт.", "armstrong_help": "Потолки Армстронг представляют собой каркас из несущих и поперечных профилей в виде ячеек 60х60 см или 120х60 см, закрепленных к перекрытию при помощи подвесов, на которые уложены жесткие или мягкие плиты, светильники и вентиляционные решетки соответствующего размера. \n\tДля крепления профилей к перекрытию используются проволочные подвесы. Деталь представляет собой два стержня, соединенных пружиной-пластиной. В верхней части есть ушко для крепежа, а снизу — крюк, который продевают через отверстие в профиле. С помощью пружины-пластины можно регулировать высоту подвесов, это позволяет скомпенсировать перепады на черновом потолке. Есть несколько типов подвесов, рассчитанных на определённый вес (4,5-15 кг/м²). При расчёте нагрузки учитывают массу плит и профилей (около 0,5 кг/м²). Предельную нагрузку и вес панелей производитель указывает на упаковке. Подвесы крепят вдоль несущего профиля с шагом в 1200 мм. Угловой профиль крепится по периметру стен с шагом 0,5 м. Минимальная высота профиля от потолка 120 мм. Универсальный несущий (или основной) профиль крепится к потолку подвесами. Стандартная длина — 3,7 м. Между ним вставляют поперечные рейки длиной 1,2 м. с шагом через 0,6 м. Между рейками 1,2 м. вставляются рейки 0.6 м.", "brick_help": "Если нужно расчитать кирпич с запасом, то толщину раствора можно не указывать. Если вы рассчитываете кирпич для коробки дома, то от каждой стены нужно вычесть одну толщину стены.", "ceiling_help": "Обычно производители предлагают панели длиной 3 или 4 метра, по этому, максимальная длина стены, вдоль которой будут монтироваться панели, не должна превышать 4-х метров. Приложение рассчитывает оптимальный вариант при котором отходы материала будут минимальны. \n\tЕсли вставки использовать не предпологается, то ширину вставок указывать не надо. \n\tКоличество шины не рассчитывается, поскольку её количество зависит индивидуальных особенностей конструкции потолка.", "cement_help": "Покупая цемент, обратите внимание на дату его изготовления, так как длительное хранение приводит к излишнему скоплению влаги в цементе и такой состав отличается низким качеством. Возраст цемента необходимо указывать в поправках расчётов. Для более комфортной работы с цементными растворами необходимо применять пластификаторы, либо для бытовых работ обычные моющие средства. Они помогают достичь пластичности раствора и упрощают процесс замешивания. Выбор пластификаторов достаточно большой, необходимо выбирать наиболее подходящий для ваших условий, например в холодное время нужно использовать пластификаторы с противоморозными добавками.", "directory_text": "На устройстах под управлением анроид 11 и выше папка находится по пути: Android/media/ru.gvpdroid.foreman_free/PROrab. На остальных устройствах папка приложения находится в корне внутренней памяти устройства.", "dis_help": "Введите среднюю толщину слоя для смесей и штукатурок или количество слоёв для красок и грунтовок, затем введите площадь.", "dry_floor_help": "Если основание пола имеет перепады, то за толщину стяжки берётся среднее значение. \n\tПлоскость основания не должна иметь выступов – они могут повредить гидроизоляционную плёнку. Не менее важно избавиться и от провалов, трещин или ям. \n\tМинимальная толщина слоя засыпки составляет 20 мм. Если толщина засыпки больше 60 мм., то между слоями надо проложить слой состоящий из листов ГВЛ. \n\tДля сухой стяжки применяются элементы пола из ГВЛ 1200*600*20мм. Листы укладываются по принципу укладки ламината, то есть со смещением стыков.", "finance_help": "Здесь можно контролировать ваши доходы и расходы. К примеру, вести отчёт по закупке материалов. \n\tДолгое нажатие на пункт вызывает контекстное меню.", "gyps_divider_help": "Профиль для направляющих элементов подбирается в зависимости от нужной толщины конструкции. Профиль делится на два типа: UW (ПН - профиль направляющий - размеры: 50x40 мм, 65x40 мм, 75x40 мм и 100x40 мм) и CW (ПС - профиль стоечный - размеры: 50x50 мм, 65x50 мм, 75x50 мм и 100x50 мм). Гипсокатон применяется толщиной 12,5 мм. Если требуется бОльшая прочность конструкции, то обшивку делают в два слоя гипсокартона толщиной 9,5 мм. \n\tВ расчётах используется такой алгоритм: направляющий профиль крепится на стенах, потолке и полу, стойки ставятся с интервалом 40 см., 60 см. или 30 см. (противопожарные перегородки). На каждый проём добавляется перемычка из профиля ПН. Проёмы укрепляются либо деревяным брусом, либо добавочными профилями ПС - это в расчёты не входит.", "gyps_roof_help": "При расчётах длину комнаты надо указывать по длине гипсокартона. \n\tДля монтажа потолков используется профиль потолочный ПП 60x27, профиль направляющий ПН 28x27, \"крабы\", подвесы, соединители, саморезы с пресс шайбой (СММ) 4,2x13, саморезы 3,5x25. Гипсокартон применяется толщиной 9,5 мм (ГКЛ, ГКЛВ, ГКЛО). Направляющий профиль крепится по периметру на стенах с шагом 50 см. Каркас монтируется ячейкой 60x50 см, шаг подвесов - 70 см.", "gyps_wall_help": "Для обшивки стен используется профиль потолочный ПП 60x27, профиль направляющий ПН 28x27, \"крабы, подвесы, соединители, саморезы с пресс шайбой\n        (СММ) 4,2x13, саморезы 3,5x25 и саморезы 3,5x35 для двухслойной обшивки. Гипсокартон\n        применяется толщиной 12,5 мм (ГКЛ, ГКЛВ, ГКЛО) или 9,5 мм для двухслойной обшивки.\n        Направляющий профиль крепится по периметру с шагом 50 см.\n        Каркас монтируется с шагом 60 см или 40 см. Если высота стены превышает высоту гипсокартона,\n        то в местах соединения листов ставятся перемычки из профиля.", "instruction_fence_b": "Сначала с помощью деревянных колышков размечается положение заборного ограждения участка по всему периметру. Первыми размечаются столбы калитки и ворот. После этого размечаются пролеты с шагом 2,5 - 3 м. Затем делается разметка фундамента. Если перепад уровней на участке составляет более 0,5 м на 10 м, фундамент выполняют ступеньками. \n\t При строительстве стоит учитывать, что высота фундамента должна возвышаться над уровнем земли не менее чем на 10 см, чтобы во время дождя он был защищен от грязи. Фундамент возводится высотой 40 - 60 см, шириной 25 - 40 см , рекомендуется расширять к низу. \n\t Под столбы ямы выкапываются сечением 38 х 38 или 51 х 51 см (в зависимости от вида кладки столбов) и глубиной 100 - 120 см (от уровня грунта). Дно траншеи и столбов просыпается смесью песка и щебня на высоту 8 - 10 см и утрамбовывается. В качестве сердечников для столбов используются трубы круглого (диаметром 76 мм) или квадратного сечения (от 60×60 мм). Далее фундамент армируется металлической арматурой, предварительно покрытой антикоррозионной грунтовкой или использовать стеклопластиковую арматуру. Для фундамента используется бетонный раствор на базе цемента, гранитного щебня и песка. Рекомендуемая марка бетона от М-200 (В15) и выше. \n\t После строительства фундамента к столбам привариваются лаги из металлического профиля 25 х 40 мм (20 х 40 мм). Затем возводятся кирпичные столбики из красного или декоративного кирпича, их выполняют шириной в 1,5 или 2 кирпича. Общепринятая высота ограждений составляет 200 см от цоколя. \n\t После возведения столбиков в верхней части устанавливают бетонные или металлические колпаки. Далее крепятся листы профнастила. Соседние листы должны стыковаться внахлёст, с креплением к лагам кровельными саморезами 4,8 х 29 мм. Крепление осуществляется с шагом 25 - 35 см.", "instruction_fence_l": "При выборе профнастила следует отдать предпочтение материалу, изготовленному в соответствии с ГОСТом 24045-94. Для монтажа заборов применим стеновой профнастил (маркируется с буквы “С”), с высотой волны до 21 мм (в маркировке высота волны указывается цифрой следующей за буквой “С”) и стандартной полезной шириной листов 1150 мм. \n\n\t С помощью деревянных колышков размечается положение заборного ограждения участка по всему периметру. С шагом 2,5 - 3 м отмечаются места расположения столбов забора, будущих ворот и калитки. Планируется грунт по периметру забора. Высота заборных столбов принимается из расчёта их заглубления в грунт примерно на треть высоты забора. В качестве столбов используются трубы круглого (диаметром 76 миллиметров) или квадратного сечения (от 60 × 60 мм) и длиной 3 м. \n\t Порезанные по размеру столбы окрашиваются в два слоя, а верх их должен быть заварен накладками для предотвращения попадания внутрь воды. Ручным буром производится бурение ям диаметром 150 мм. Столбы забора устанавливаются в пробуренные ямы на песчано-гравийную подушку строго вертикально по отвесу. Ямы заливаются бетоном. \n\t Перед началом проведения дальнейших работ надо сделать трёхсуточный перерыв для полного затвердевания цементного раствора. К столбам на расстоянии 30 см от их верха и низа привариваются лаги (прожилины) из профильной трубы 40 × 25 мм (40 × 20 мм). При высоте забора более 1,65 м, посередине приваривается ещё одна лага. Лаги и места их примыкания к столбам тщательно грунтуются и окрашиваются. \n\t Далее крепятся листы профнастила. Соседние листы должны стыковаться внахлёст, с креплением к лагам кровельными саморезами 4,8 х 29 мм. Крепление осуществляется с шагом 25 - 35 см.", "instruction_fence_p": "Толщина металла евроштакетника может быть от 0,4 до 1,5 мм. Наиболее распространенный — из стали толщиной 0,5 мм. Ширина штакетины — от 80 мм до 128 мм, длинна — до 2 метров. Есть металлически штакетник с разным профилем: П (прямоугольным), М образным и полукруглым. М-образные имеют больше ребер, соответственно имеют большую жесткость. Полукруглые также имеют большую жесткость, но сложнее формируются и имеют обычно более высокую цену. Для большей прочности, вдоль длинной стороны также могут быть сформированы дополнительные канавки. Штакетник обычно размещают с небольшим зазором. Размещать материал можно практически на любом расстоянии, но соблюдая единственное правило: запрещено делать зазор больше, чем ширина самой штакетины. Если планируется устройство забора из евроштакетника в два ряда в шахматном порядке, то расстояние между планками берется равным половине ширины планки или на 5–20 мм больше. \n\n\t С помощью деревянных колышков размечается положение заборного ограждения участка по всему периметру. С шагом 2,5 - 3 м отмечаются места расположения столбов забора, будущих ворот и калитки. Планируется грунт по периметру забора. Высота заборных столбов принимается из расчёта их заглубления в грунт примерно на треть высоты забора. В качестве столбов используются трубы круглого (диаметром 76 миллиметров) или квадратного сечения (от 60 × 60 мм) и длиной 3 м. \n\t Порезанные по размеру столбы окрашиваются в два слоя, а верх их должен быть заварен накладками для предотвращения попадания внутрь воды. Ручным буром производится бурение ям диаметром 150 мм. Столбы забора устанавливаются в пробуренные ямы на песчано-гравийную подушку строго вертикально по отвесу. Ямы заливаются бетоном. \n\t Перед началом проведения дальнейших работ надо сделать трёхсуточный перерыв для полного затвердевания цементного раствора. К столбам на расстоянии 30 см от их верха и низа привариваются лаги (прожилины) из профильной трубы 40 × 25 мм (40 × 20 мм). При высоте забора более 1,65 м, посередине приваривается ещё одна лага. Лаги и места их примыкания к столбам тщательно грунтуются и окрашиваются. \n\t На завершающем этапе понадобится сделать заполнение пролетов забора. Для этого натягивают веревку точно вдоль уровней ламелей (сверху и снизу). Сначала к столбу привинчивают саморезами первую планку, проверяя ее положение с помощью строительного уровня. Затем нужно сделать разметку лаг маркером и прикрутить вторую планку, далее двигаться в том же порядке. Крепление осуществляется кровельными саморезами (4,8 х 19 мм) по два на каждую лагу.", "insulant_help": "", "laminate_help": "При укладке ламината надо учитывать несколько правил: разбежка стыков не должна быть меньше 1/3 панели или менее 30 см, минимальный отрезок панели 20 см, если последний ряд получается менее 5 см, то первый ряд нужно подрезать так, чтобы последний получился не меньше 5 см. \n\tПриложение учитывает все эти моменты. В схеме укладки показаны самые важные крайние панели. Номера на обрезках указывают на свою пару. \n\tВ настройках можно указать отступ от стен. Если размеры комнаты гуляют, то ширину надо указывать максимальную, а панели подрезать по месту.", "lin_help": "При расчётах введите размеры помещения и от какой стены собираетесь раскатывать линолеум. Приложение определит нужную ширину и длину материала. Длина рассчитывается с запасом 10 см.", "note_help": "Здесь можно записать ваши заметки. \n\tДолгое нажатие на пункт вызывает контекстное меню.", "panels_help": "Крепление панелей производят либо прямо на стену на саморезы, скобы или на жидкие гвозди, либо на подготовленную заранее обрешетку. Обрешетка изготавливается либо из деревяного бруса, либо из металлопрофиля, которые монтируются к поверхности на определенном расстоянии: 30 - 40 см. Обрешетка крепятся перпендикулярно относительно направления панелей. \n\tЕсли стена к которой крепятся рейки является деревянной или любой другой в которую легко вкручиваются саморезы, то для крепления брусков лучше всего применять их. Если стена бетонная или кирпичная, то лучше всего крепить бруски при помощи дюбель-гвоздей или при помощи обычных дюбелей и саморезов.", "plasters_help": "", "plinth_help": "Здесь можно расчитать не только плинтус, но и количество молдингов, количество бордюров для дорожек и т.п.", "smeta_help": "Расценки в прайсе указаны примерные и могут отличаться в зависимости от региона. \n\tГотовую смету можно сохранить или отправить в формате txt, xls или pdf. Сметы сохраняются в папку PROrab/Сметы. \n\tДолгое нажатие на пункт в списке вызывает контекстное меню.\n \n\tВ деталях смет можно внести примечание, которое будет отображаться в форме для печати. Также можно изменить дату создания и задать коэффициент или процент. В пункте контроля выплат можно ввести аванс или полную оплату.\n Отметки \"Выполнено\" нужны для составления актов выполненых работ. К каждой отметке присваивается дата. При экспорте акта можно сделать выборку по интервалу дат. \n\tПрайс можно редактировать в приложении или на ПК. Для редактирования в приложении надо в разделе \"Сметы\" в меню выбрать \"Прайс\" - \"Редактировать прайс\" и внести изменения. Отдельные разделы можно сохранить или отправить. \n\tДля редактирования на ПК нужно в меню выбрать \"Прайс\" - \"Сохранить прайс\" - \"Сохранить в csv\", затем перенести на компьютер иотредактировать в программе Excel. После загрузить обратно в устройство и сделать загрузку прайса. В зависимости от устройства сохранение происходит на карту памяти или во внутренний накопитель. \n\tПрайс на работу должен находиться в папке \"PROrab/ Прайс на работу\". Прайс на материалы (в приложении называется \"База\") должен находиться в папке \"PROrab/ Прайс на материалы\".\n Прайс можно сохранять и загружать под любым именем. Можно сохранить несколько разных прайсов и загружать их в приложение в любой момент.\n \n\tПри редактировании на ПК прайс должен иметь такой вид:", "smeta_help_price": "Прайс можно сохранить или отправить в формате xls, pdf и csv. Прайсы сохраняются в папку \"PROrab/Прайс на работу\" или \"PROrab/Прайс на материалы\". Для того чтобы прайс можно было загрузить в приложение, сохранять нужно в формате csv. \n\tПрайс можно редактировать в приложении или на ПК. \nДля редактирования в приложении надо в разделе \"Сметы\" в меню выбрать \"Прайс\" - \"Редактировать прайс\" и внести изменения. \n\tДля редактирования на ПК нужно в меню выбрать \"Прайс\" - \"Сохранить прайс\" - \"Сохранить в csv\", затем перенести файл на компьютер и отредактировать в программе Excel. После загрузить обратно в устройство и сделать загрузку прайса. В зависимости от устройства сохранение происходит на карту памяти или во внутренний накопитель. \n Прайс на работу должен находиться в папке \"PROrab/ Прайс на работу\". Прайс на материалы (в приложении называется \"База\") должен находиться в папке \"PROrab/ Прайс на материалы\".\n Прайс можно сохранять и загружать под любым именем. Можно сохранить несколько разных прайсов и загружать их в приложение в любой момент.\n \n\tПри редактировании на ПК прайс должен иметь такой вид:", "smeta_help_price_2": "Нужно учитывать несколько ньюансов:\n 1. Цена должна быть указана в текстовом формате.\n 2. Для разделения копеек используется запятая.\n 3. В тексте не должно быть знака ( ; ).\n 4. Сохранять файл нужно только в том же формате.", "tile_help": "Толщину слоя клея нужно указывать в половину меньше чем у зубчатого шпателя (для зуба 8 мм. толщ.слоя будет 4 мм.).", "wallpaper_help": "При расчётах обоев двери и окна не учитываются. Эти площади играют роль запаса."};
HELP.help_text2 = 'Расчёт площади I служит для расчёта одного прямоугольного помещения.\nРасчёт площади II служит для расчёта нескольких помещений или для избирательного расчёта.\n\nВ «Дополнительных участках и проёмах» укажите двери, окна, проёмы (вычитаются из площади стен, по ним считаются откосы), ниши (добавляют боковые стенки), а также дополнительные стены и участки пола/потолка со знаком «+» или «−».';

Object.assign(HELP, {"help_text1": "Все расчёты можно хранить в журнале приложения и сохранять или отправлять файлом в формате pdf или txt. Копии файлов экспорта хранятся в разделе «Файлы → Расчёты». \n\tЖурнал расчётов вызывается долгим удерживанием кнопки нужного расчёта или из меню самого расчёта.", "help_text_calc": "Все вычисления сохраняются в истории. Клик по пункту в истории помещает значение в поле ввода калькулятора. Долгое нажатие на пункт удаляет значение из истории. Долгое удерживание кнопки \"С\" очищает всю историю. \n\tКлик по полю результата вызывает функцию копирования. Скопированное значение можно вставить в любое числовое поле ввода в приложении. Вставка выполняется один раз.", "smeta_help_start": "При добавлении новой сметы название должно быть уникальным. Это нужно для того, чтобы у каждой сметы была своя уникальная папка, в которой хранятся файлы отчётов и экспорта. Для удобства название лучше всего записать так: \"Название объекта. Название сметы\". В пункте \"Заказчик\" можно выбрать из списка заказчиков или создать нового. \n\tСписок сметы формируется по очереди добавления. С помощью контекстного меню (вызывается долгим нажатием или правым кликом на пункт) можно переместить пункт или раздел вверх или вниз по списку. Также можно удалить пункт или весь раздел. \n\tДля каждого пункта сметы есть возможность ввода комментария. Комментарий служит для личной информации и файлах экспорта не отображается. \n\tВ \"Акт выполненых работ\" входят только работы и материалы отмеченные галочкой \"Выполнено\". К каждой отметке присваивается дата. При экспорте акта можно сделать выборку по интервалу дат. \n\tГотовые сметы и акты можно сохранить или отправить в формате txt, xls или pdf. Копии файлов экспорта сохраняются в разделе «Файлы → Сметы».", "smeta_help_details": "Детали сметы разделяются на три вкладки: \"Детали\", \"Финансы\" и \"Отчёты\". \n\tВ деталях сметы можно изменить название, заказчика, добавить примечание и изменить дату составления. Примечание отображается в файле экспорта. \n\tВ финансах можно ввести аванс или полную оплату, задать коэффициент (процент) на работы или материалы и конвертировать в другую валюту. \n\tВкладка \"Отчёты\" нужна для создания отчётов для заказчика. Категория для отчёта присваивется автоматически исходя от процента выполненых работ. Отчёт состоит из комментария и фото. Любой отчет можно отправить на почту или другой мессенджер.", "smeta_help_clients": "База заказчиков находится в меню раздела смет. В базу можно добавлять новых заказчиков, изменять и удалять существующих. Данные о заказчике отображаются в файле экспорта.", "smeta_help_prefs": "Настройки смет находятся в настройках приложения. \n\tЗдесь можно выбрать единицу процентовки для смет - коэффициент или процент. \n\tНумерация списка в смете может быть общая или по разделам. \n\tСортировка списка смет по умолчанию стоит \"По дате\" и последняя созданная смета будет находиться первой в списке. При сортировке \"По заказчикам\" список будет группироваться по заказчикам и первыми в списке будут сметы без указанного заказчика. \n\tСортировка списка в прайсе и базе \"По добавлению\" означает, что последняя созданная запись будет находиться последней в списке. \n\tВ пункте \"Подрядчик\" указывается информация о подрядчике, которая будет отображаться в файле экспорта.", "object_help_start": "В этом разделе создаются записи смет, расчётов, финансов и заметок по каждому объекту. \n\tСметы создаются под номерами. Каждая смета состоит из разделов (локальных смет). Разделы в локальной смете переименованы в группы. \n\tВсе расчёты, финансы и заметки созданые для объекта отображаются только в этом объекте. \n\tВ \"Акт выполненых работ\" входят только работы и материалы отмеченные галочкой \"Выполнено\". \n\tГотовые сметы и акты можно сохранить или отправить в формате pdf или xls."});

defCalc({
  id: 'laminate', sec: ['finish'], title: 'Ламинат', head: 'ЛАМИНАТ', help: 'laminate_help',
  fields: [{ k: 'a', t: 'num', l: 'Сторона A помещения', u: 'м' }, { k: 'b', t: 'num', l: 'Сторона B помещения', u: 'м' },

function laminateSVG(schema, along, pl) {

  const foot = [];

    if (f.tax === 1) foot.push(['в т.ч. НДС ' + num(tr) + '%', tax]); if (f.tax === 2) foot.push(['НДС ' + num(tr) + '%', tax], ['ВСЕГО с НДС', total]); if (f.tax === 3) foot.push(['в т.ч. НПД ' + num(tr) + '%', tax]);

/** сумма прописью (рубли/копейки, для остальных валют — без единиц) */
function sumWords(v) {
  const r = Math.floor(v + 1e-6), k = Math.round((v - r) * 100);
  const ones = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'], onesF = ['', 'одна', 'две'];
  const teens = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
  const tens = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
  const hund = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
  const tri = (n, fem) => { const o = []; o.push(hund[Math.floor(n / 100)]); const t = n % 100; if (t >= 10 && t < 20) o.push(teens[t - 10]); else { o.push(tens[Math.floor(t / 10)]); const u = t % 10; o.push(fem && u < 3 ? onesF[u] : ones[u]); } return o.filter(Boolean).join(' '); };
  if (r === 0) return 'ноль ' + (cur() === 'р.' ? 'рублей' : cur());
  const parts = []; const groups = [['', '', '', false], ['тысяча', 'тысячи', 'тысяч', true], ['миллион', 'миллиона', 'миллионов', false], ['миллиард', 'миллиарда', 'миллиардов', false]];
  let n = r, gi = 0;
  while (n > 0 && gi < 4) { const g = n % 1000; if (g) parts.unshift(tri(g, groups[gi][3]) + (gi ? ' ' + plural(g, groups[gi][0], groups[gi][1], groups[gi][2]) : '')); n = Math.floor(n / 1000); gi++; }
  let s = parts.join(' ');
  if (cur() === 'р.') s += ' ' + plural(r, 'рубль', 'рубля', 'рублей') + ' ' + String(k).padStart(2, '0') + ' ' + plural(k, 'копейка', 'копейки', 'копеек');
  else s += ' ' + cur() + (k ? ' ' + String(k).padStart(2, '0') : '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ===================== КАЛЬКУЛЯТОР ===================== */
function evalExpr(src) {
  const s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.').replace(/\s/g, '');
  let i = 0;
  const peek = () => s[i];
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const op = s[i++]; const t = term(); v = op === '+' ? v + t : v - t; } return v; }
  function term() { let v = factor(); while (peek() === '*' || peek() === '/') { const op = s[i++]; const f = factor(); if (op === '/' && f === 0) throw new Error('div0'); v = op === '*' ? v * f : v / f; } return v; }
  function factor() {
    if (peek() === '-') { i++; return -factor(); } if (peek() === '+') { i++; return factor(); }
    let v;
    if (peek() === '√') { i++; v = Math.sqrt(factor()); }
    else if (peek() === '(') { i++; v = expr(); if (peek() === ')') i++; }
    else { const m = s.slice(i).match(/^\d*\.?\d+(e[+-]?\d+)?|^\d+\./); if (!m) throw new Error('syntax'); i += m[0].length; v = parseFloat(m[0]); }
    while (peek() === '%' || peek() === '²') { v = s[i] === '%' ? v / 100 : v * v; i++; }
    return v;
  }
  const v = expr(); if (i < s.length) throw new Error('syntax');
  return v;
}
function openCalculator() {
  let expr = '', result = null;
  const exEl = h('div', { class: 'expr' }), resEl = h('div', { class: 'res' }, '0'), hist = h('div', { class: 'hist' });
  const fmt = v => { const r = Math.round(v * 1e10) / 1e10; return String(r).replace('.', ','); };
  const live = () => { exEl.textContent = expr || ' '; try { if (expr) { const v = evalExpr(expr); if (isFinite(v)) resEl.textContent = fmt(v); } else resEl.textContent = '0'; } catch (e) { } };
  const drawHist = () => { hist.innerHTML = ''; DB.calcHistory.forEach((hh, idx) => { const d = h('div', { title: 'Клик — вставить, долгое нажатие — удалить', onclick: () => { expr += hh.r; live(); } }, hh.e + ' = ' + hh.r); onLong(d, () => { DB.calcHistory.splice(idx, 1); save(); drawHist(); }); hist.append(d); }); if (!DB.calcHistory.length) hist.append(h('span', { class: 'hint' }, 'История пуста')); };
  const press = k => {
    if (k === 'C') { expr = ''; result = null; }
    else if (k === '⌫') expr = expr.slice(0, -1);
    else if (k === '=') {
      try { const v = evalExpr(expr); if (!isFinite(v)) throw 0; const r = fmt(v); DB.calcHistory.unshift({ e: expr, r }); DB.calcHistory = DB.calcHistory.slice(0, 50); save(); drawHist(); expr = r; result = r; }
      catch (e) { resEl.textContent = 'Ошибка'; return; }
    } else {
      if (result !== null && /[\d,]/.test(k)) expr = '';
      result = null; expr += k;
    }
    live();
  };
  const K = (k, cls) => { const b = h('button', { class: cls || '', onclick: () => press(k) }, k); if (k === 'C') onLong(b, () => { DB.calcHistory = []; save(); drawHist(); toast('История очищена'); }); return b; };
  const keys = h('div', { class: 'keys' },
    K('C', 'op'), K('('), K(')'), K('÷', 'op'), K('7'), K('8'), K('9'), K('×', 'op'), K('4'), K('5'), K('6'), K('−', 'op'),
    K('1'), K('2'), K('3'), K('+', 'op'), K('√', 'op'), K('0'), K(','), K('%', 'op'), K('²', 'op'), K('⌫', 'op'), h('button', { class: 'eq', style: { gridColumn: 'span 2' }, onclick: () => press('=') }, '='));
  const disp = h('div', { class: 'disp', title: 'Клик — скопировать результат', onclick: () => { const v = resEl.textContent; if (v === 'Ошибка') return; CLIP = pnum(v); copyText(v.replace(/\s/g, '')); toast('Скопировано. Кликните по пустому числовому полю, чтобы вставить.'); m.close(); } }, exEl, resEl);
  const m = modal({ title: 'Калькулятор', body: h('div', { class: 'calc' }, disp, keys, h('div', { class: 'fl' }, 'История'), hist) });
  const keyH = e => { if (!document.body.contains(m.el)) return document.removeEventListener('keydown', keyH);
    const map = { '*': '×', '/': '÷', '-': '−', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Delete': 'C', '.': ',' };
    const k = map[e.key] || e.key; if (/^[\d,+()%]$/.test(k) || ['×', '÷', '−', '=', '⌫', 'C'].includes(k)) { e.preventDefault(); press(k); } };
  document.addEventListener('keydown', keyH);
  drawHist(); live();
}
